[registry]
name = "Axonyx UI"
namespace = "@axonyx/ui"
description = "Foundry component and block registry for Axonyx-native apps."
mode = "native"
version = 1

[[components]]
name = "Button"
title = "Button"
path = "src/foundry/Button.ax"
import = "@axonyx/ui/foundry/Button"
preview = "/components/button"
category = "actions"
status = "v0"
install = "cargo ax add ui"
copy = "cargo ax add button"
tags = ["action", "link", "cta", "forged"]
description = "Primary action primitive for links, submits, ghost actions, and forged calls to action."

[[components]]
name = "Card"
title = "Card"
path = "src/foundry/Card.ax"
import = "@axonyx/ui/foundry/Card"
preview = "/components/card"
category = "surfaces"
status = "v0"
install = "cargo ax add ui"
copy = "cargo ax add card"
tags = ["surface", "panel", "docs", "dashboard"]
description = "Foundry surface primitive for content panels, dashboard widgets, and docs blocks."

[[components]]
name = "Field"
title = "Field"
path = "src/foundry/Field.ax"
import = "@axonyx/ui/foundry/Field"
preview = "/components/field"
category = "forms"
status = "v0"
install = "cargo ax add ui"
copy = "cargo ax add field"
tags = ["form", "input", "label", "validation"]
description = "Form shell for labels, inputs, hints, and validation states."

[[components]]
name = "AppShell"
title = "AppShell"
path = "src/foundry/AppShell.ax"
import = "@axonyx/ui/foundry/AppShell"
preview = "/components/app-shell"
category = "layout"
status = "v0"
install = "cargo ax add ui"
copy = "cargo ax add app-shell"
tags = ["layout", "shell", "docs", "dashboard"]
description = "Application frame for docs, dashboards, admin tools, and CMS layouts."

[[components]]
name = "Sidebar"
title = "Sidebar"
path = "src/foundry/Sidebar.ax"
import = "@axonyx/ui/foundry/Sidebar"
preview = "/components/sidebar"
category = "layout"
status = "v0"
install = "cargo ax add ui"
copy = "cargo ax add sidebar"
tags = ["navigation", "layout", "rail", "menu"]
description = "Navigation rail used by AppShell, docs pages, dashboards, and admin blocks."

[[blocks]]

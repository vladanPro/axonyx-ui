name: UI Package

on:
  pull_request:
  push:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: ui-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Package and Color Modes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:modes
      - run: npm run build
      - run: npm pack --dry-run
      - run: cargo fmt --all -- --check
      - run: cargo test
      - run: cargo package
